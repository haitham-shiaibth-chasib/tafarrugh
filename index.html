<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قوائم الاسماء الخاصة باوامر التفرغ البحثي لحملة الشهادات العليا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d2a3a;--muted:#5b6b7f;--line:#d9e2ec;--soft:#eef4fb;--accent:#2f6aa3;--accent-soft:#dce8f5;--bg:#f7f9fc;--hit:#fff3b0}
  *{box-sizing:border-box}
  body{margin:0;font-family:Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  header{background:#fff;border-bottom:1px solid var(--line);padding:22px 16px 18px;text-align:center}
  .org{font-size:15px;color:var(--accent);font-weight:600;margin:0}
  h1{font-size:clamp(19px,4.2vw,26px);margin:4px 0 0;font-weight:700}
  main{max-width:980px;margin:0 auto;padding:18px 14px 40px}
  .search{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px}
  .box{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--accent-soft);border-radius:14px;padding:4px 14px;transition:border-color .15s}
  .box:focus-within{border-color:var(--accent)}
  .box svg{flex:none;color:var(--muted)}
  input{flex:1;border:0;outline:0;font:inherit;font-size:18px;padding:12px 0;background:transparent;color:var(--ink);min-width:0}
  button.clear{border:0;background:var(--soft);color:var(--muted);border-radius:8px;font:inherit;font-size:14px;padding:4px 10px;cursor:pointer}
  .hint{font-size:13.5px;color:var(--muted);margin:8px 4px 0}
  .status{font-size:15px;color:var(--muted);margin:6px 4px 12px}
  .status b{color:var(--ink)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .name{font-size:18px;font-weight:700}
  .seq{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:1px 8px;white-space:nowrap}
  dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;margin:8px 0 0}
  dl div{display:flex;gap:6px;font-size:14.5px;min-width:0}
  dt{color:var(--muted);white-space:nowrap}
  dd{margin:0;font-weight:600;overflow-wrap:anywhere}
  .day dd{color:var(--accent)}
  mark{background:var(--hit);color:inherit;border-radius:3px;padding:0 1px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;background:#fff;border:1px dashed var(--line);border-radius:12px}
  .more{display:block;margin:6px auto 0;border:1px solid var(--line);background:#fff;font:inherit;font-size:15px;padding:8px 22px;border-radius:10px;cursor:pointer;color:var(--accent)}
  .tabs{display:flex;gap:6px;margin:10px 0 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px}
  .tab{flex:1;border:0;background:transparent;font:inherit;font-size:15px;padding:7px 6px;border-radius:9px;cursor:pointer;color:var(--muted)}
  .tab.on{background:var(--accent-soft);color:var(--ink);font-weight:700}
  footer{text-align:center;font-size:13px;color:var(--muted);padding:10px 0 28px}
</style>
</head>
<body>
<header>
  <p class="org">قسم الإعداد والتدريب / شعبة البحوث والدراسات التربوية</p>
  <h1>قوائم الأسماء الخاصة بأوامر التفرغ البحثي لحملة الشهادات العليا</h1>
</header>
<main>
  <div class="search">
    <label class="box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="اكتب اسمك أو جزءاً منه…" autocomplete="off" aria-label="البحث بالاسم">
      <button class="clear" id="clear" type="button" hidden>مسح</button>
    </label>
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" data-v="orig">حسب التسلسل الأصلي</button>
      <button type="button" class="tab" data-v="alpha">مرتبة أبجدياً</button>
    </div>
    <p class="hint">يمكن البحث بالاسم كاملاً أو بجزء منه، أو باسم المدرسة أو التخصص. لا يهم الفرق بين أ وا، وة وه، وى وي.</p>
  </div>
  <div class="status" id="status"></div>
  <div id="list"></div>
</main>
<footer>عدد الأسماء الكلي: <span id="total"></span></footer>

  for(let i=0;i<src.length;i++){
    if(mark[i]&&!on){html+="<mark>";on=true}
    if(!mark[i]&&on&&!/\s/.test(src[i])){html+="</mark>";on=false}
    html+=esc(src[i]);
  }
  if(on) html+="</mark>";
  return html;
}

function card(r){
  return `<article class="card"><div class="top"><span class="name">${highlight(r[1])}</span><span class="seq">التسلسل ${r[0]}</span></div>
  <dl>
    <div><dt>${F[2]}:</dt><dd>${esc(r[2])}</dd></div>
    <div><dt>${F[4]}:</dt><dd>${esc(r[4])}</dd></div>
    <div><dt>${F[3]}:</dt><dd>${highlight(r[3])}</dd></div>
    <div><dt>${F[5]}:</dt><dd>${highlight(r[5])}</dd></div>
    <div><dt>${F[6]}:</dt><dd>${highlight(r[6])}</dd></div>
    <div class="day"><dt>${F[7]}:</dt><dd>${esc(r[7])}</dd></div>
  </dl></article>`;
}

function render(reset){
  const list=$("list");
  if(reset){ list.innerHTML=""; shown=0; }
  const q=$("q").value.trim();
  if(!q){
    $("status").innerHTML="اكتب في مربع البحث لعرض النتائج، أو تصفّح القائمة كاملة أدناه.";
  } else if(!hits.length){
    $("status").innerHTML="";
    list.innerHTML=`<div class="empty">لا توجد نتائج لـ «${esc(q)}».<br>جرّب كتابة جزء من الاسم فقط، مثل الاسم الأول واسم الأب.</div>`;
    return;
  } else {
    $("status").innerHTML=`عدد النتائج: <b>${hits.length}</b>`;
  }
  const next=hits.slice(shown, shown+PAGE);
  const old=list.querySelector(".more"); if(old) old.remove();
  list.insertAdjacentHTML("beforeend", next.map(i=>card(DATA[i])).join(""));
  shown+=next.length;
  if(shown<hits.length){
    const b=document.createElement("button"); b.className="more"; b.type="button";
    b.textContent=`عرض المزيد (${hits.length-shown} متبقٍ)`; b.onclick=()=>render(false); list.appendChild(b);
  }
}

function search(){
  const q=norm($("q").value);
  $("clear").hidden=!$("q").value;
  terms=q?q.split(" "):[];
  if(!terms.length){ hits=DATA.map((_,i)=>i); render(true); return; }
  const nameHits=[], otherHits=[];
  IDX.forEach((x,i)=>{
    if(terms.every(t=>x.name.includes(t.replace(/^عبد$/,"عبد")))) nameHits.push(i);
    else if(terms.every(t=>x.all.includes(t))) otherHits.push(i);
  });
  // names whose start matches come first
  nameHits.sort((a,b)=>(IDX[b].name.startsWith(q))-(IDX[a].name.startsWith(q)) || a-b);
  hits=nameHits.concat(otherHits);
  render(true);
}

let timer;
$("q").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(search,120)});
$("clear").addEventListener("click",()=>{$("q").value="";search();$("q").focus()});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  const v=b.dataset.v; DATA = v==="alpha"?ALPHA:ORIG; IDX = IDXS[v]; search();
}));
$("total").textContent=DATA.length;
search();
</script>
</body>
